name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - name: Install dev dependencies
        run: flox activate -- npm ci
      - name: Typecheck
        run: flox activate -- npm run typecheck
      - name: Test
        run: flox activate -- npm test
      - name: Build package
        run: flox build brag

  publish:
    # Publish one build per platform to FloxHub on version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    environment: floxhub # FLOX_AUTH_TOKEN lives on this environment
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x86_64-linux
          - os: ubuntu-24.04-arm # aarch64-linux
          - os: macos-13 # x86_64-darwin
          - os: macos-latest # aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - name: Authenticate with FloxHub
        run: flox auth login --token "${{ secrets.FLOX_AUTH_TOKEN }}"
      - name: Publish
        run: flox publish -o imkarrer brag
