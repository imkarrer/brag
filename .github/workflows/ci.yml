name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - name: Install dev dependencies
        run: flox activate -- npm ci
      - name: Typecheck
        run: flox activate -- npm run typecheck
      - name: Test
        run: flox activate -- npm test
      - name: Build package
        run: flox build brag

  publish:
    # Publish one build per platform to FloxHub on version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    environment: floxhub # FLOX_AUTH_TOKEN lives on this environment
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x86_64-linux
          - os: ubuntu-24.04-arm # aarch64-linux
          - os: macos-13 # x86_64-darwin
          - os: macos-latest # aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - name: Authenticate with FloxHub
        # --token was removed from flox auth login; --token-file is the
        # documented CI path. A runner has no keyring, so the validated token
        # has to go to plain text, and --once keeps that to this login rather
        # than changing the stored preference. The secret arrives through env
        # rather than being interpolated into the script text, so a token that
        # ever contained shell metacharacters cannot run as shell.
        env:
          FLOX_AUTH_TOKEN: ${{ secrets.FLOX_AUTH_TOKEN }}
        run: |
          printf '%s' "$FLOX_AUTH_TOKEN" |
            flox auth login --token-file=- --insecure-storage --once
      - name: Confirm the token is live
        # flox publish fails late and slowly; a dead or expired token should
        # say so here instead of after a full build.
        run: flox auth status
      - name: Publish
        run: flox publish -o imkarrer brag
